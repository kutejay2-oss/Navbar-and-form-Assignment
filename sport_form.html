<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Championship Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>School Championship Registration Form</h2>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="school-name">School name:<span class="required">*</span></label>
        <input type="text" id="school-name" name="school-name" required>
      </div>

      <div class="form-group">
        <label>Schooler name:<span class="required">*</span></label>
        <div class="two-column">
          <div>
            <input type="text" id="schooler-first" name="schooler-first" placeholder="First" required>
          </div>
          <div>
            <input type="text" id="schooler-last" name="schooler-last" placeholder="Last" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Parent name:<span class="required">*</span></label>
        <div class="two-column">
          <div>
            <input type="text" id="parent-first" name="parent-first" placeholder="First" required>
          </div>
          <div>
            <input type="text" id="parent-last" name="parent-last" placeholder="Last" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="parent-phone">Parent phone:<span class="required">*</span></label>
        <input type="tel" id="parent-phone" name="parent-phone" placeholder="### ### ####" required>
      </div>

      <div class="form-group">
        <label for="parent-email">Parent email:<span class="required">*</span></label>
        <input type="email" id="parent-email" name="parent-email" required>
      </div>

      <div class="form-group">
        <label for="preferred-sport">Preferred sport:<span class="required">*</span></label>
        <input type="text" id="preferred-sport" name="preferred-sport" required>
      </div>
    </form>
  </div>

</body>
</html>
